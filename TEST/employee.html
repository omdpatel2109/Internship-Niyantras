<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="employee.css">
    <script src="employee.js"defer></script>

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Employee Management System</h1><br>
            <p>Welcome to the Employee Management System!</p>
        </div>

        <!-- Add Employee Form -->
        <div class="employee-form">
            <p>Enter Employee Details: </p>
            <label for="employeeName">Employee First Name:</label>
            <input type="text" id="employeeName" placeholder="Employee First Name" required>
            <br><br>
            <label for="employeeLastName">Employee Last Name:</label>
            <input type="text" id="employeeLastName" placeholder="Employee Last Name" required>
            <br><br>
            <label for="employeeEmail">Employee Email:</label>
            <input type="email" id="employeeEmail" placeholder="Employee Email" required/>
            <br><br>
            <label for="employeeDepartment">Employee Department:</label>
            <select id="employeeDepartment">
                <option value="">All Departments</option>
                <option value="Engineering">Engineering</option>
                <option value="Support">Support</option>
                <option value="Research and Development">Research and Development</option>
                <option value="Human Resources">Human Resources</option>  
                <option value="Product Management">Product Management</option>
                <option value="Marketing">Marketing</option>
                <option value="Services">Services</option>
                <option value="Accounting">Accounting</option>
                <option value="Training">Training</option> 
                <option value="Sales">Sales</option>  
            </select>
            <br><br>
            <label for="employeeTitle">Employee Title:</label>
            <input type="text" id="employeeTitle" placeholder="Employee Title" required/> 
            <br><br>
            <button id="addEmployeeButton">Add Employee</button>
            <br><br>
            <button id="addApiButton">Add Employee from API</button>
        </div>
    </div>
    <div>

        <!-- Employee Data table -->
        <div class="employee-table">
            <h2>Employee List</h2>
            <!-- filter scroll down -->
             <select id="filterDepartment">
                <option value="">All Departments</option>
                <option value="Engineering">Engineering</option>
                <option value="Support">Support</option>
                <option value="Research and Development">Research and Development</option>
                <option value="Human Resources">Human Resources</option>  
                <option value="Product Management">Product Management</option>
                <option value="Marketing">Marketing</option>
                <option value="Services">Services</option>
                <option value="Accounting">Accounting</option>
                <option value="Training">Training</option> 
                <option value="Sales">Sales</option>  
            </select>
            <table id="employeeTable">
                <thead>
                    <tr>
                        <th id="firstName">First Name</th>
                        <th id="lastName">Last Name</th>
                        <th id="email">Email</th>
                        <th id="department">Department</th>
                        <th id="title">Title</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Employee data will be dynamically added here -->
                </tbody>
            </table>
    </div>

</body>
</html>
