<!DOCTYPE html>
<html lang="en">
<head>
  <title>React Code Test</title>
  <script src="https://unpkg.com" crossorigin></script>
  <script src="https://unpkg.com" crossorigin></script>
  <script src="https://unpkg.com"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function TaskActions() {
      const [loadingButtonId, setLoadingButtonId] = useState(null);
      const [statusMessage, setStatusMessage] = useState('');

      const handleAction = async (buttonId, actionName) => {
        setLoadingButtonId(buttonId); 
        setStatusMessage("Starting " + actionName + "..."); 
        
        try {
          await new Promise((resolve) => setTimeout(resolve, 2000));
          setStatusMessage("Finished " + actionName + "!"); 
        } catch (error) {
          setStatusMessage("Error occurred.");
        } finally {
          setLoadingButtonId(null); // Re-enable clicked button
          setTimeout(() => setStatusMessage(''), 3000); // Clear message
        }
      };

      return (
        <div>
          <button 
            onClick={() => handleAction('delete-btn', 'delete')} 
            disabled={loadingButtonId === 'delete-btn'} 
          >
            {loadingButtonId === 'delete-btn' ? 'Deleting...' : 'Delete'}
          </button>

          <button 
            onClick={() => handleAction('archive-btn', 'archive')} 
            disabled={loadingButtonId === 'archive-btn'} 
          >
            {loadingButtonId === 'archive-btn' ? 'Archiving...' : 'Archive'}
          </button>

          {statusMessage && <p>{statusMessage}</p>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TaskActions />);
  </script>

</body>
</html>
